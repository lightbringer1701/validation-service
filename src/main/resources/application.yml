spring:
  application:
    name: validation-service
  main:
    banner-mode: off
  profiles:
    active: local
  cloud:
    stream:
      kafka:
        binder:
          brokers: ${spring.kafka.bootstrap-servers}
          producer-properties:
            key.serializer: org.apache.kafka.common.serialization.StringSerializer
          consumer-properties:
            key.deserializer: org.apache.kafka.common.serialization.StringDeserializer
      bindings:
        processing-in-0:
          group: ${spring.application.name}
          content-type: application/json
        processing-out-0:
          content-type: application/json
        failed-out-0:
          content-type: application/json
    openfeign:
      client:
        config:
          model-registry:
            connectTimeout: 5000
            readTimeout: 5000

logging:
  level:
    root: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,bindings,metrics,prometheus

---
# Local development profile
spring:
  config:
    activate:
      on-profile: local
  kafka:
    bootstrap-servers: localhost:9093
  cloud:
    stream:
      kafka:
        binder:
          brokers: localhost:9093
      bindings:
        processing-in-0:
          destination: pipeline.validation
        processing-out-0:
          destination: pipeline.outcoming
        failed-out-0:
          destination: pipeline.failed
    openfeign:
      client:
        config:
          model-registry:
            url: http://localhost:3001

logging:
  level:
    com:
      flexi: DEBUG

server:
  port: 22010

---
# Docker profile
spring:
  config:
    activate:
      on-profile: docker
  kafka:
    bootstrap-servers: kafka:9092
  cloud:
    stream:
      kafka:
        binder:
          brokers: kafka:9092
      bindings:
        processing-in-0:
          destination: pipeline.validation
        processing-out-0:
          destination: pipeline.outcoming
        failed-out-0:
          destination: pipeline.failed
    openfeign:
      client:
        config:
          model-registry:
            url: http://model-registry:8080

logging:
  level:
    com:
      flexi: INFO

server:
  port: 8080