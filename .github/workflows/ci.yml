name: CI

on:
  push:
    branches:
      - master
      - "codex/**"
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: FLEXI_COMMON_TOKEN
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          FLEXI_COMMON_TOKEN: ${{ secrets.FLEXI_COMMON_TOKEN }}

      - name: Verify
        run: ./mvnw -B -ntp clean verify
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          FLEXI_COMMON_TOKEN: ${{ secrets.FLEXI_COMMON_TOKEN }}

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/*.xml"
          if-no-files-found: warn
