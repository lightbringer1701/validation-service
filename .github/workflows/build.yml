name: Build & Publish

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: FLEXI_COMMON_TOKEN
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          FLEXI_COMMON_TOKEN: ${{ secrets.FLEXI_COMMON_TOKEN }}

      - name: Build & Test
        run: mvn clean package
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          FLEXI_COMMON_TOKEN: ${{ secrets.FLEXI_COMMON_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          IMAGE_NAME=ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}
          docker build \
            --build-arg GITHUB_ACTOR=${{ github.actor }} \
            --build-arg FLEXI_COMMON_TOKEN=${{ secrets.FLEXI_COMMON_TOKEN }} \
            --secret id=maven_settings,src=$HOME/.m2/settings.xml \
            -t $IMAGE_NAME:$VERSION -t $IMAGE_NAME:latest .
          docker push $IMAGE_NAME:$VERSION
          docker push $IMAGE_NAME:latest